name: Deploy Min oversikt demo (GitHub Pages)

# Statisk mock-bygg av frontenden (vite build --mode pages) med «Min oversikt»-demoen.
# Kjøres bare manuelt. Krever at GitHub Pages er slått på med kilde «GitHub Actions».
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-oversikt
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 'Checking Out Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Installing Dependencies'
        uses: ./.github/actions/install

      - name: 'Validate Oversikt-API'
        run: pnpm --filter oversikt-api validate

      - name: 'Build static mock'
        run: pnpm --filter frontend build:pages
        env:
          STATIC_MOCK_BASE: '/${{ github.event.repository.name }}/'

      - name: 'Build API reference and docs'
        run: |
          pnpm --filter oversikt-api docs
          mkdir -p packages/frontend/dist/api packages/frontend/dist/docs
          cp -r packages/oversikt-api/dist/* packages/frontend/dist/api/
          cp -r packages/oversikt-api/dist/docs/. packages/frontend/dist/docs/

      - name: 'Upload'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
