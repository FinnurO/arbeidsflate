<defs><clipPath id="klipp-jonas"><circle cx="100" cy="100" r="100"/></clipPath></defs><g transform="translate(68 40) scale(0.82)"><circle cx="100" cy="100" r="100" fill="#d3ecdc"/><g clip-path="url(#klipp-jonas)"><path d="M18 214 Q20 150 100 144 Q180 150 182 214 Z" fill="#ffffff"/><path d="M100 146 L100 214" stroke="#c9d1db" stroke-width="2"/><g fill="#9aa6b5"><circle cx="88" cy="164" r="3"/><circle cx="112" cy="164" r="3"/><circle cx="88" cy="182" r="3"/><circle cx="112" cy="182" r="3"/><circle cx="88" cy="200" r="3"/><circle cx="112" cy="200" r="3"/></g><path d="M78 148 Q100 162 122 148" stroke="#c9d1db" stroke-width="3" fill="none"/><rect x="88" y="118" width="24" height="34" rx="9" fill="#d49f7c"/><circle cx="62" cy="96" r="8" fill="#f0c4a2"/><circle cx="138" cy="96" r="8" fill="#f0c4a2"/><ellipse cx="100" cy="92" rx="38" ry="45" fill="#f0c4a2"/><path d="M63 96 Q62 142 100 142 Q138 142 137 96 Q132 126 100 128 Q68 126 63 96 Z" fill="#7a5434" opacity=".92"/><circle cx="86" cy="94" r="3.8" fill="#2a2522"/><circle cx="114" cy="94" r="3.8" fill="#2a2522"/><circle cx="87.2" cy="92.8" r="1.1" fill="#fff"/><circle cx="115.2" cy="92.8" r="1.1" fill="#fff"/><path d="M78 83 Q86 79 93 83" stroke="#7a5434" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M107 83 Q114 79 122 83" stroke="#7a5434" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M100 100 Q96 110 101 112" stroke="#d49f7c" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M89 120 Q100 129 111 120" stroke="#8a4a3c" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M61 88 Q58 42 100 40 Q142 42 139 88 Q136 64 100 61 Q66 62 61 88 Z" fill="#7a5434"/></g><circle cx="100" cy="100" r="98.5" fill="none" stroke="#ffffff" stroke-width="3"/></g><text x="150" y="238" font-size="23" font-weight="700" fill="#1e2b3c" text-anchor="middle">Jonas Berg</text><text x="150" y="262" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">46 år · kokk og styreleder i Lykke Bistro</text><text x="150" y="281" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">AS · far til Amir og Lea</text><rect x="74.12499999999999" y="314" width="151.75000000000003" height="26" rx="13" fill="#fff"/><text x="150" y="331.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Amir og Lea · foresatt</text><rect x="65.37500000000001" y="346" width="169.24999999999997" height="26" rx="13" fill="#fff"/><text x="150" y="363.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Lykke Bistro · styreleder</text><path d="M28 415 h244" stroke="#18794e" stroke-opacity=".35" stroke-width="1.5"/><text x="28" y="445" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">«Nora har oversikten. Jeg vil ta min</text><text x="28" y="467" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">del uten å måtte spørre henne om</text><text x="28" y="489" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">alt.»</text>
<text x="336" y="46" font-size="11.5" font-weight="700" fill="#18794e" letter-spacing="1.1">PERSONA · DEN ANDRE FORELDEREN</text><text x="336" y="76" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">Deler omsorgen for Lea med Nora og søker pleiepenger selv. Står på kjøkkenet det</text><text x="336" y="99" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">meste av dagen. Har ikke tilgang til Parvin eller dødsboet, fordi han verken er</text><text x="336" y="122" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">arving eller har fullmakt.</text><text x="336" y="163" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">BEHOV</text><text x="644" y="163" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">DET SOM ER VANSKELIG I DAG</text><circle cx="344" cy="182" r="4" fill="#18794e"/><text x="360" y="187" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Se det samme som Nora om barna</text><circle cx="344" cy="212" r="4" fill="#18794e"/><text x="360" y="217" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Vite hvilke oppgaver som er hans</text><circle cx="344" cy="242" r="4" fill="#18794e"/><text x="360" y="247" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Følge restauranten som styreleder</text><circle cx="652" cy="182" r="8" fill="#fbe3df"/><path d="M652 178 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="185.8" r="1.3" fill="#b42318"/><text x="668" y="187" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Informasjonen går gjennom Nora</text><circle cx="652" cy="212" r="8" fill="#fbe3df"/><path d="M652 208 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="215.8" r="1.3" fill="#b42318"/><text x="668" y="217" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Pleiepengene hans venter på papirer</text><text x="668" y="237" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">han ikke ser</text><circle cx="652" cy="262" r="8" fill="#fbe3df"/><path d="M652 258 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="265.8" r="1.3" fill="#b42318"/><text x="668" y="267" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Uklart hvem som har svart på hva</text><rect x="336" y="305" width="588" height="142" rx="12" fill="#eaf6ef"/><text x="356" y="335" font-size="11.5" font-weight="700" fill="#18794e" letter-spacing="1.1">DET OVERSIKTEN GIR</text><circle cx="364" cy="352" r="8" fill="#18794e"/><path d="M360.4 352 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="357" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Den samme oversikten for barna som Nora, fordi begge har foreldreansvar</text><circle cx="364" cy="382" r="8" fill="#18794e"/><path d="M360.4 382 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="387" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Styrelederens utsnitt av restauranten, ikke alt daglig leder ser</text><circle cx="364" cy="412" r="8" fill="#18794e"/><path d="M360.4 412 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="417" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Hvem som har gjort hva, så de slipper å gjøre ting to ganger</text><rect x="336" y="469" width="124" height="26" rx="13" fill="#fff" stroke="#18794e" stroke-width="1.2"/><text x="398" y="486.5" font-size="12.5" font-weight="600" fill="#18794e" text-anchor="middle">Alvorlig sykt barn</text><rect x="468" y="469" width="101.5" height="26" rx="13" fill="#fff" stroke="#18794e" stroke-width="1.2"/><text x="518.75" y="486.5" font-size="12.5" font-weight="600" fill="#18794e" text-anchor="middle">Barn og skole</text><rect x="577.5" y="469" width="93.5" height="26" rx="13" fill="#fff" stroke="#18794e" stroke-width="1.2"/><text x="624.25" y="486.5" font-size="12.5" font-weight="600" fill="#18794e" text-anchor="middle">Drive bedrift</text>
</g>
