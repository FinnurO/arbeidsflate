daglig leder i Lykke Bistro AS ·</text><text x="150" y="281" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">mor til Amir og Lea</text><rect x="74.12499999999999" y="314" width="151.75000000000003" height="26" rx="13" fill="#fff"/><text x="150" y="331.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Amir og Lea · foresatt</text><rect x="60.624999999999986" y="346" width="178.75000000000003" height="26" rx="13" fill="#fff"/><text x="150" y="363.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Lykke Bistro · daglig leder</text><rect x="83.625" y="378" width="132.75" height="26" rx="13" fill="#fff"/><text x="150" y="395.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Parvin · fullmektig</text><rect x="86.25" y="410" width="127.50000000000001" height="26" rx="13" fill="#fff"/><text x="150" y="427.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Dødsboet · arving</text><path d="M28 477 h244" stroke="#0062ba" stroke-opacity=".35" stroke-width="1.5"/><text x="28" y="507" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">«Jeg bruker kveldene på å finne ut</text><text x="28" y="529" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">hvem jeg skal svare først.»</text>
<text x="336" y="46" font-size="11.5" font-weight="700" fill="#0062ba" letter-spacing="1.1">PERSONA · DEN SOM HOLDER ALT SAMMEN</text><text x="336" y="76" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">Står i fem livssituasjoner på én gang: et alvorlig sykt barn, en far som nettopp døde,</text><text x="336" y="99" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">en mor som trenger hjelp, en sønn på vei til ungdomsskolen og en restaurant som</text><text x="336" y="122" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">skal drives videre.</text><text x="336" y="163" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">BEHOV</text><text x="644" y="163" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">DET SOM ER VANSKELIG I DAG</text><circle cx="344" cy="182" r="4" fill="#0062ba"/><text x="360" y="187" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Se alt som haster på ett sted</text><circle cx="344" cy="212" r="4" fill="#0062ba"/><text x="360" y="217" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Få vite hva familien har rett til</text><circle cx="344" cy="242" r="4" fill="#0062ba"/><text x="360" y="247" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Slippe å gi de samme opplysningene på</text><text x="360" y="267" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">nytt</text><circle cx="652" cy="182" r="8" fill="#fbe3df"/><path d="M652 178 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="185.8" r="1.3" fill="#b42318"/><text x="668" y="187" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Sju innlogginger og ingen som ser</text><text x="668" y="207" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">helheten</text><circle cx="652" cy="232" r="8" fill="#fbe3df"/><path d="M652 228 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="235.8" r="1.3" fill="#b42318"/><text x="668" y="237" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">En sak hos Nav venter på en oppgave i</text><text x="668" y="257" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">restauranten</text><circle cx="652" cy="282" r="8" fill="#fbe3df"/><path d="M652 278 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="285.8" r="1.3" fill="#b42318"/><text x="668" y="287" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Rettigheter oppdages tilfeldig eller for</text><text x="668" y="307" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">sent</text><rect x="336" y="345" width="588" height="142" rx="12" fill="#eaf2fb"/><text x="356" y="375" font-size="11.5" font-weight="700" fill="#0062ba" letter-spacing="1.1">DET OVERSIKTEN GIR</text><circle cx="364" cy="392" r="8" fill="#0062ba"/><path d="M360.4 392 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="397" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Alle hun handler for, med hvor mange oppgaver som venter hos hver</text><circle cx="364" cy="422" r="8" fill="#0062ba"/><path d="M360.4 422 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="427" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Sammenhengene på tvers, med hva hun bør gjøre først</text><circle cx="364" cy="452" r="8" fill="#0062ba"/><path d="M360.4 452 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="457" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Opplysninger med kilde, så hun vet hvem hun skal kontakte</text><rect x="336" y="509" width="124" height="26" rx="13" fill="#fff" stroke="#0062ba" stroke-width="1.2"/><text x="398" y="526.5" font-size="12.5" font-weight="600" fill="#0062ba" text-anchor="middle">Alvorlig sykt barn</text><rect x="468" y="509" width="109.00000000000001" height="26" rx="13" fill="#fff" stroke="#0062ba" stroke-width="1.2"/><text x="522.5" y="526.5" font-size="12.5" font-weight="600" fill="#0062ba" text-anchor="middle">Dødsfall og arv</text><rect x="585" y="509" width="122.50000000000001" height="26" rx="13" fill="#fff" stroke="#0062ba" stroke-width="1.2"/><text x="646.25" y="526.5" font-size="12.5" font-weight="600" fill="#0062ba" text-anchor="middle">Hjelp i hverdagen</text><rect x="715.5" y="509" width="101.5" height="26" rx="13" fill="#fff" stroke="#0062ba" stroke-width="1.2"/><text x="766.25" y="526.5" font-size="12.5" font-weight="600" fill="#0062ba" text-anchor="middle">Barn og skole</text><rect x="825" y="509" width="93.5" height="26" rx="13" fill="#fff" stroke="#0062ba" stroke-width="1.2"/><text x="871.75" y="526.5" font-size="12.5" font-weight="600" fill="#0062ba" text-anchor="middle">Drive bedrift</text>
</g>
