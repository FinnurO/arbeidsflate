<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Min oversikt – dokumentasjon</title>
    <!-- Enkel visning av Markdown-dokumentene i docs/ for GitHub Pages: ?side=familien|arkitektur|guide -->
    <style>
      :root {
        color-scheme: light dark;
        --tekst: #1e2b3c;
        --dempet: #5b6675;
        --bakgrunn: #ffffff;
        --flate: #f4f6f8;
        --kant: #d5dae0;
        --lenke: #0062ba;
        --topp: #1e2b3c;
        --topp-tekst: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --tekst: #e6e9ed;
          --dempet: #a3adb9;
          --bakgrunn: #14191f;
          --flate: #1f262e;
          --kant: #39434f;
          --lenke: #7cb8f2;
          --topp: #0b0f14;
          --topp-tekst: #e6e9ed;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bakgrunn);
        color: var(--tekst);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 1rem;
        line-height: 1.6;
      }
      a {
        color: var(--lenke);
      }
      .topp {
        background: var(--topp);
        color: var(--topp-tekst);
        padding: 0.75rem 1rem;
      }
      .topp-innhold {
        max-width: 52rem;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        align-items: baseline;
      }
      .topp strong {
        font-weight: 600;
        margin-right: auto;
      }
      .topp nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1rem;
      }
      .topp a {
        color: var(--topp-tekst);
        text-underline-offset: 0.2em;
      }
      .topp a[aria-current='page'] {
        font-weight: 600;
        text-decoration-thickness: 2px;
      }
      .topp .ekstern {
        opacity: 0.85;
      }
      main {
        max-width: 52rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 4rem;
      }
      h1,
      h2,
      h3,
      h4 {
        line-height: 1.25;
        margin: 2rem 0 0.75rem;
      }
      h1 {
        font-size: 2rem;
        margin-top: 0.5rem;
      }
      h2 {
        font-size: 1.5rem;
        padding-bottom: 0.3rem;
        border-bottom: 1px solid var(--kant);
      }
      h3 {
        font-size: 1.2rem;
      }
      h1:target,
      h2:target,
      h3:target,
      h4:target {
        scroll-margin-top: 1rem;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;
        font-size: 0.9em;
        background: var(--flate);
        padding: 0.1em 0.3em;
        border-radius: 4px;
      }
      pre {
        background: var(--flate);
        border: 1px solid var(--kant);
        border-radius: 6px;
        padding: 0.75rem 1rem;
        overflow-x: auto;
        line-height: 1.45;
      }
      pre code {
        background: none;
        padding: 0;
      }
      blockquote {
        margin: 1rem 0;
        padding: 0.25rem 1rem;
        border-left: 4px solid var(--kant);
        color: var(--dempet);
      }
      .tabell {
        overflow-x: auto;
        margin: 1rem 0;
      }
      table {
        border-collapse: collapse;
        min-width: 100%;
      }
      th,
      td {
        border: 1px solid var(--kant);
        padding: 0.4rem 0.65rem;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: var(--flate);
        font-weight: 600;
      }
      img {
        max-width: 100%;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--kant);
        margin: 2rem 0;
      }
      .mermaid {
        margin: 1.25rem 0;
        overflow-x: auto;
        text-align: center;
      }
      .melding {
        color: var(--dempet);
      }
      .bunn {
        margin-top: 3rem;
        padding-top: 1rem;
        border-top: 1px solid var(--kant);
        color: var(--dempet);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header class="topp">
      <div class="topp-innhold">
        <strong>Min oversikt – dokumentasjon</strong>
        <nav aria-label="Dokumenter">
          <a href="?side=familien" data-side="familien">Familien og personas</a>
          <a href="?side=arkitektur" data-side="arkitektur">Arkitektur</a>
          <a href="?side=guide" data-side="guide">API-guide</a>
        </nav>
        <nav aria-label="Videre">
          <a class="ekstern" href="../?mock=true&amp;playwrightId=rahimi-berg">Åpne demoen</a>
          <a class="ekstern" href="../api/">API-referanse</a>
        </nav>
      </div>
    </header>
    <main id="innhold">
      <p class="melding">Laster dokumentet …</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script>
      const SIDER = ['familien', 'arkitektur', 'guide'];
      const REPO = 'https://github.com/FinnurO/arbeidsflate/blob/main/packages/oversikt-api/docs/';
      const params = new URLSearchParams(location.search);
      const side = SIDER.includes(params.get('side')) ? params.get('side') : 'familien';
      const innhold = document.getElementById('innhold');

      for (const lenke of document.querySelectorAll('[data-side]')) {
        if (lenke.dataset.side === side) lenke.setAttribute('aria-current', 'page');
      }

      // Overskrifts-id-er som på GitHub, så #anker fra GitHub virker her også.
      const lagSlug = (tekst) =>
        tekst
          .trim()
          .toLowerCase()
          .replace(/[^\p{L}\p{N}\s_-]/gu, '')
          .replace(/\s/g, '-');

      const merkOverskrifter = () => {
        const brukt = new Map();
        for (const overskrift of innhold.querySelectorAll('h1, h2, h3, h4, h5, h6')) {
          const grunn = lagSlug(overskrift.textContent);
          const antall = brukt.get(grunn) ?? 0;
          brukt.set(grunn, antall + 1);
          overskrift.id = antall ? `${grunn}-${antall}` : grunn;
        }
      };

      // Lenker mellom dokumentene blir ?side=…, andre relative lenker går til repoet på GitHub.
      const rettLenker = () => {
        for (const lenke of innhold.querySelectorAll('a[href]')) {
          const href = lenke.getAttribute('href');
          if (/^([a-z][a-z0-9+.-]*:|#|\/\/)/i.test(href)) continue;
          const dok = href.match(/^(?:\.\/)?(familien|arkitektur|guide)\.md(#.*)?$/);
          if (dok) {
            lenke.setAttribute('href', `?side=${dok[1]}${dok[2] ?? ''}`);
          } else {
            lenke.setAttribute('href', new URL(href, REPO).href);
          }
        }
        for (const bilde of innhold.querySelectorAll('img[src]')) {
          const src = bilde.getAttribute('src');
          if (/^([a-z][a-z0-9+.-]*:|\/\/)/i.test(src)) continue;
          bilde.setAttribute('src', `${new URL(src, REPO).href}?raw=true`);
        }
      };

      const pakkInnTabeller = () => {
        for (const tabell of innhold.querySelectorAll('table')) {
          const omslag = document.createElement('div');
          omslag.className = 'tabell';
          tabell.replaceWith(omslag);
          omslag.append(tabell);
        }
      };

      const tegnDiagrammer = async () => {
        const noder = [];
        for (const kode of innhold.querySelectorAll('pre > code.language-mermaid')) {
          const diagram = document.createElement('div');
          diagram.className = 'mermaid';
          diagram.textContent = kode.textContent;
          kode.parentElement.replaceWith(diagram);
          noder.push(diagram);
        }
        if (!noder.length || !window.mermaid) return;
        const morkt = matchMedia('(prefers-color-scheme: dark)').matches;
        mermaid.initialize({ startOnLoad: false, theme: morkt ? 'dark' : 'default', securityLevel: 'strict' });
        try {
          await mermaid.run({ nodes: noder });
        } catch (feil) {
          console.error('Kunne ikke tegne diagram', feil);
        }
      };

      const gaTilAnker = () => {
        if (!location.hash) return;
        const mal = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (mal) mal.scrollIntoView();
      };

      const vis = async () => {
        try {
          const svar = await fetch(`${side}.md`, { cache: 'no-cache' });
          if (!svar.ok) throw new Error(`HTTP ${svar.status}`);
          const markdown = await svar.text();
          innhold.innerHTML = marked.parse(markdown, { gfm: true });
          merkOverskrifter();
          rettLenker();
          pakkInnTabeller();
          const tittel = innhold.querySelector('h1');
          if (tittel) document.title = `${tittel.textContent} – Min oversikt – dokumentasjon`;
          const kilde = document.createElement('p');
          kilde.className = 'bunn';
          kilde.innerHTML = `Kilde: <a href="${REPO}${side}.md">docs/${side}.md på GitHub</a>`;
          innhold.append(kilde);
          gaTilAnker();
          await tegnDiagrammer();
          gaTilAnker();
        } catch (feil) {
          innhold.innerHTML = '';
          const melding = document.createElement('p');
          melding.className = 'melding';
          melding.textContent = `Fant ikke dokumentet «${side}» (${feil.message}).`;
          innhold.append(melding);
        }
      };

      vis();
    </script>
  </body>
</html>
