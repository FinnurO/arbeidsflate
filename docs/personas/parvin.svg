<defs><clipPath id="klipp-parvin"><circle cx="100" cy="100" r="100"/></clipPath></defs><g transform="translate(68 40) scale(0.82)"><circle cx="100" cy="100" r="100" fill="#e4dcf5"/><g clip-path="url(#klipp-parvin)"><circle cx="100" cy="40" r="19" fill="#c9c6cf"/><path d="M18 214 Q20 150 100 144 Q180 150 182 214 Z" fill="#6d4bb0"/><path d="M100 148 L100 214" stroke="rgba(0,0,0,.2)" stroke-width="2"/><g fill="rgba(255,255,255,.7)"><circle cx="106" cy="166" r="3"/><circle cx="106" cy="184" r="3"/><circle cx="106" cy="202" r="3"/></g><path d="M82 148 Q100 160 118 148" stroke="#f4f1ec" stroke-width="5" fill="none"/><rect x="88" y="118" width="24" height="34" rx="9" fill="#ad7957"/><circle cx="62" cy="96" r="8" fill="#cf9a78"/><circle cx="138" cy="96" r="8" fill="#cf9a78"/><ellipse cx="100" cy="92" rx="38" ry="45" fill="#cf9a78"/><circle cx="86" cy="94" r="3.2" fill="#2a2522"/><circle cx="114" cy="94" r="3.2" fill="#2a2522"/><path d="M78 83 Q86 79 93 83" stroke="#8f8a94" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M107 83 Q114 79 122 83" stroke="#8f8a94" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M100 100 Q96 110 101 112" stroke="#ad7957" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M89 120 Q100 129 111 120" stroke="#8a4a3c" stroke-width="2.6" fill="none" stroke-linecap="round"/><g stroke="#ad7957" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".9"><path d="M84 62 Q100 59 116 62"/><path d="M73 96 l-5 -2 M73 99 l-5 2 M127 96 l5 -2 M127 99 l5 2"/><path d="M84 116 Q82 122 85 127 M116 116 Q118 122 115 127"/></g><g stroke="#3a3a44" stroke-width="2.4" fill="rgba(255,255,255,.18)"><rect x="73" y="85" width="25" height="19" rx="8"/><rect x="102" y="85" width="25" height="19" rx="8"/></g><path d="M98 92 Q100 90 102 92" stroke="#3a3a44" stroke-width="2.4" fill="none"/><path d="M61 96 Q58 50 100 47 Q142 50 139 96 Q132 66 100 63 Q68 66 61 96 Z" fill="#c9c6cf"/></g><circle cx="100" cy="100" r="98.5" fill="none" stroke="#ffffff" stroke-width="3"/></g><text x="150" y="238" font-size="23" font-weight="700" fill="#1e2b3c" text-anchor="middle">Parvin Rahimi</text><text x="150" y="262" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">78 år · enke etter Reza · bor alene i</text><text x="150" y="281" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">huset deres i Lykke</text><rect x="88.875" y="314" width="122.24999999999999" height="26" rx="13" fill="#fff"/><text x="150" y="331.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Nora · fullmektig</text><rect x="87.75" y="346" width="124.50000000000001" height="26" rx="13" fill="#fff"/><text x="150" y="363.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Arving i dødsboet</text><path d="M28 437 h244" stroke="#5b3aa4" stroke-opacity=".35" stroke-width="1.5"/><text x="28" y="467" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">«Jeg vil bo hjemme. Men jeg klarer</text><text x="28" y="489" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">ikke papirene alene lenger.»</text>
<text x="336" y="46" font-size="11.5" font-weight="700" fill="#5b3aa4" letter-spacing="1.1">PERSONA · TRENGER HJELP I HVERDAGEN</text><text x="336" y="76" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">Det var Reza som tok seg av papirene og kjørte bil. Nå har hun sluttet å kjøre,</text><text x="336" y="99" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">glemmer legemidlene innimellom og har falt på badet. Hun har gitt Nora fullmakt,</text><text x="336" y="122" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">men bestemmer fortsatt selv.</text><text x="336" y="163" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">BEHOV</text><text x="644" y="163" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">DET SOM ER VANSKELIG I DAG</text><circle cx="344" cy="182" r="4" fill="#5b3aa4"/><text x="360" y="187" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Hjelp hjemme fra kommunen</text><circle cx="344" cy="212" r="4" fill="#5b3aa4"/><text x="360" y="217" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Komme seg ut og treffe folk</text><circle cx="344" cy="242" r="4" fill="#5b3aa4"/><text x="360" y="247" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">En fremtidsfullmakt mens hun selv kan</text><text x="360" y="267" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">gi den</text><circle cx="652" cy="182" r="8" fill="#fbe3df"/><path d="M652 178 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="185.8" r="1.3" fill="#b42318"/><text x="668" y="187" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Hjelpen kommer fra sju ulike steder</text><circle cx="652" cy="212" r="8" fill="#fbe3df"/><path d="M652 208 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="215.8" r="1.3" fill="#b42318"/><text x="668" y="217" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Fullmakten gjelder ikke alt, som</text><text x="668" y="237" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">journalen</text><circle cx="652" cy="262" r="8" fill="#fbe3df"/><path d="M652 258 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="265.8" r="1.3" fill="#b42318"/><text x="668" y="267" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Arven berører boligen hun bor i</text><rect x="336" y="305" width="588" height="142" rx="12" fill="#f2eefb"/><text x="356" y="335" font-size="11.5" font-weight="700" fill="#5b3aa4" letter-spacing="1.1">DET OVERSIKTEN GIR</text><circle cx="364" cy="352" r="8" fill="#5b3aa4"/><path d="M360.4 352 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="357" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Vurderingsbesøk, trygghetsalarm og hjemmesykepleie samlet</text><circle cx="364" cy="382" r="8" fill="#5b3aa4"/><path d="M360.4 382 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="387" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Pensjonen beregnet på nytt med gjenlevenderett, uten søknad</text><circle cx="364" cy="412" r="8" fill="#5b3aa4"/><path d="M360.4 412 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="417" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Forslag om fremtidsfullmakt, middag levert hjem og sorggruppe</text><rect x="336" y="469" width="122.50000000000001" height="26" rx="13" fill="#fff" stroke="#5b3aa4" stroke-width="1.2"/><text x="397.25" y="486.5" font-size="12.5" font-weight="600" fill="#5b3aa4" text-anchor="middle">Hjelp i hverdagen</text><rect x="466.5" y="469" width="109.00000000000001" height="26" rx="13" fill="#fff" stroke="#5b3aa4" stroke-width="1.2"/><text x="521" y="486.5" font-size="12.5" font-weight="600" fill="#5b3aa4" text-anchor="middle">Dødsfall og arv</text>
</g>
<rect x=".75" y=".75" width="958.5" height="529.5" rx="17.5" fill="none" stroke="#d6dde6" stroke-width="1.5"/>
