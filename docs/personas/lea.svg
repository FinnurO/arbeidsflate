<defs><clipPath id="klipp-lea"><circle cx="100" cy="100" r="100"/></clipPath></defs><g transform="translate(68 40) scale(0.82)"><circle cx="100" cy="100" r="100" fill="#fbd9e2"/><g clip-path="url(#klipp-lea)"><circle cx="50" cy="104" r="17" fill="#3a261b"/><circle cx="150" cy="104" r="17" fill="#3a261b"/><circle cx="62" cy="96" r="5" fill="#c0265a"/><circle cx="138" cy="96" r="5" fill="#c0265a"/><path d="M36 214 Q38 160 100 154 Q162 160 164 214 Z" fill="#e5577e"/><path d="M80 158 Q100 172 120 158 L114 168 Q100 176 86 168 Z" fill="#ffffff"/><rect x="88" y="122" width="24" height="34" rx="9" fill="#c48f6c"/><circle cx="60" cy="102" r="8" fill="#e2b08e"/><circle cx="140" cy="102" r="8" fill="#e2b08e"/><ellipse cx="100" cy="98" rx="41" ry="42" fill="#e2b08e"/><circle cx="86" cy="100" r="3.8" fill="#2a2522"/><circle cx="114" cy="100" r="3.8" fill="#2a2522"/><circle cx="87.2" cy="98.8" r="1.1" fill="#fff"/><circle cx="115.2" cy="98.8" r="1.1" fill="#fff"/><path d="M78 89 Q86 85 93 89" stroke="#3a261b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M107 89 Q114 85 122 89" stroke="#3a261b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M100 106 Q96 116 101 118" stroke="#c48f6c" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="80" cy="116" r="7" fill="#e8806f" opacity=".28"/><circle cx="120" cy="116" r="7" fill="#e8806f" opacity=".28"/><path d="M89 126 Q100 135 111 126" stroke="#8a4a3c" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M61 94 Q60 50 100 48 Q140 50 139 94 Q130 70 100 69 Q70 70 61 94 Z" fill="#3a261b"/></g><circle cx="100" cy="100" r="98.5" fill="none" stroke="#ffffff" stroke-width="3"/></g><text x="150" y="238" font-size="23" font-weight="700" fill="#1e2b3c" text-anchor="middle">Lea Rahimi</text><text x="150" y="262" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">5 år · Lykke barnehage · følges av</text><text x="150" y="281" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">barneavdelingen ved Lykke sykehus</text><rect x="64.37500000000001" y="314" width="171.24999999999997" height="26" rx="13" fill="#fff"/><text x="150" y="331.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Nora og Jonas · foresatte</text><rect x="52.50000000000003" y="346" width="194.99999999999994" height="26" rx="13" fill="#fff"/><text x="150" y="363.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Barnekoordinator i kommunen</text><text x="150" y="422" font-size="40" font-weight="800" fill="#c0265a" text-anchor="middle">19 t</text><text x="150" y="444" font-size="12.5" font-weight="400" fill="#4f5d70" text-anchor="middle">i uka går til å søke, klage og koordinere</text><text x="150" y="461" font-size="12.5" font-weight="400" fill="#4f5d70" text-anchor="middle">(snitt, Helsedirektoratet 2021)</text><path d="M28 496 h244" stroke="#c0265a" stroke-opacity=".35" stroke-width="1.5"/><text x="28" y="526" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">«Vi bruker mer tid på søknader enn</text><text x="28" y="548" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">på å være sammen med henne.»</text><text x="28" y="574" font-size="12.5" fill="#4f5d70">– Nora og Jonas</text>
<text x="336" y="46" font-size="11.5" font-weight="700" fill="#c0265a" letter-spacing="1.1">PERSONA · ALVORLIG SYKT BARN</text><text x="336" y="76" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">Følges av spesialisthelsetjenesten over lang tid. Familien har saker hos Nav,</text><text x="336" y="99" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">kommunen, sykehuset og barnehagen samtidig. Diagnosen står ikke i dataene, for</text><text x="336" y="122" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">tjenestene trenger den ikke.</text><text x="336" y="163" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">BEHOV</text><text x="644" y="163" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">DET SOM ER VANSKELIG I DAG</text><circle cx="344" cy="182" r="4" fill="#c0265a"/><text x="360" y="187" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Én oversikt over alle saker, med frister</text><circle cx="344" cy="212" r="4" fill="#c0265a"/><text x="360" y="217" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Ett fast kontaktpunkt</text><circle cx="344" cy="242" r="4" fill="#c0265a"/><text x="360" y="247" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Slippe å fortelle historien på nytt</text><circle cx="652" cy="182" r="8" fill="#fbe3df"/><path d="M652 178 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="185.8" r="1.3" fill="#b42318"/><text x="668" y="187" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Den samme legeerklæringen i hver</text><text x="668" y="207" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">søknad</text><circle cx="652" cy="232" r="8" fill="#fbe3df"/><path d="M652 228 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="235.8" r="1.3" fill="#b42318"/><text x="668" y="237" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Vedtak som ikke blir levert</text><circle cx="652" cy="262" r="8" fill="#fbe3df"/><path d="M652 258 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="265.8" r="1.3" fill="#b42318"/><text x="668" y="267" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Avslag og klagefrister midt i alt annet</text><rect x="336" y="305" width="588" height="142" rx="12" fill="#fdeef2"/><text x="356" y="335" font-size="11.5" font-weight="700" fill="#c0265a" letter-spacing="1.1">DET OVERSIKTEN GIR</text><circle cx="364" cy="352" r="8" fill="#c0265a"/><path d="M360.4 352 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="357" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Barnekoordinatoren, kontaktlegen og barnehagen øverst</text><circle cx="364" cy="382" r="8" fill="#c0265a"/><path d="M360.4 382 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="387" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">«6 av 12 timer avlastning levert i november»</text><circle cx="364" cy="412" r="8" fill="#c0265a"/><path d="M360.4 412 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="417" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Rettigheter foreslått ut fra situasjonen, og hjelp til å klage</text><rect x="336" y="469" width="124" height="26" rx="13" fill="#fff" stroke="#c0265a" stroke-width="1.2"/><text x="398" y="486.5" font-size="12.5" font-weight="600" fill="#c0265a" text-anchor="middle">Alvorlig sykt barn</text>
</g>
