x="150" y="266" font-size="23" font-weight="700" fill="#1e2b3c" text-anchor="middle">Rahimi</text><text x="150" y="290" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">Reza døde 12. oktober 2026, 80 år ·</text><text x="150" y="309" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">privat skifte</text><rect x="36.87500000000003" y="342" width="226.24999999999994" height="26" rx="13" fill="#fff"/><text x="150" y="359.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Nora, Sara, Ali og Parvin · arvinger</text><rect x="87.625" y="374" width="124.75" height="26" rx="13" fill="#fff"/><text x="150" y="391.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">3 av 4 har signert</text><path d="M28 424 h244" stroke="#4a5568" stroke-opacity=".35" stroke-width="1.5"/><text x="28" y="454" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">«Vi visste ikke hva pappa eide,</text><text x="28" y="476" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">eller hvem vi skulle si fra til.»</text><text x="28" y="502" font-size="12.5" fill="#4f5d70">– Nora, Sara og Ali</text>
<text x="336" y="46" font-size="11.5" font-weight="700" fill="#4a5568" letter-spacing="1.1">PERSONA · DØDSBOET OG ARVINGENE</text><text x="336" y="76" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">Reza eide boligen der han og Parvin bodde, 20 % av aksjene i Lykke Bistro AS og</text><text x="336" y="99" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">en bil, og var stedfortreder for skjenkebevillingen. Han hadde ikke testament.</text><text x="336" y="140" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">BEHOV</text><text x="644" y="140" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">DET SOM ER VANSKELIG I DAG</text><circle cx="344" cy="159" r="4" fill="#4a5568"/><text x="360" y="164" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Vite hva avdøde eide og skyldte</text><circle cx="344" cy="189" r="4" fill="#4a5568"/><text x="360" y="194" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Si opp avtaler og faste trekk</text><circle cx="344" cy="219" r="4" fill="#4a5568"/><text x="360" y="224" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Bli enige om skiftet</text><circle cx="652" cy="159" r="8" fill="#fbe3df"/><path d="M652 155 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="162.8" r="1.3" fill="#b42318"/><text x="668" y="164" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Opplysningene ligger i banker,</text><text x="668" y="184" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Kartverket og Skatteetaten</text><circle cx="652" cy="209" r="8" fill="#fbe3df"/><path d="M652 205 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="212.8" r="1.3" fill="#b42318"/><text x="668" y="214" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Arvingene bor spredt og signerer hver</text><text x="668" y="234" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">for seg</text><circle cx="652" cy="259" r="8" fill="#fbe3df"/><path d="M652 255 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="262.8" r="1.3" fill="#b42318"/><text x="668" y="264" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Dødsfallet gir restauranten nye oppgaver</text><rect x="336" y="302" width="588" height="142" rx="12" fill="#f0f2f5"/><text x="356" y="332" font-size="11.5" font-weight="700" fill="#4a5568" letter-spacing="1.1">DET OVERSIKTEN GIR</text><circle cx="364" cy="349" r="8" fill="#4a5568"/><path d="M360.4 349 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="354" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Konti, gjeld, eiendom, kjøretøy og aksjer, hver med kilde</text><circle cx="364" cy="379" r="8" fill="#4a5568"/><path d="M360.4 379 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="384" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Arvingene med signeringsstatus, også Parvin via fullmakt</text><circle cx="364" cy="409" r="8" fill="#4a5568"/><path d="M360.4 409 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="414" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">At opplysningene slettes etter 12 måneder, som i Digitalt dødsbo</text><rect x="336" y="466" width="109.00000000000001" height="26" rx="13" fill="#fff" stroke="#4a5568" stroke-width="1.2"/><text x="390.5" y="483.5" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="middle">Dødsfall og arv</text>
