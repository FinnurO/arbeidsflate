<svg xmlns="http://www.w3.org/2000/svg" width="960" height="528" viewBox="0 0 960 528" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="tittel-amir">
<title id="tittel-amir">Persona: Amir Rahimi</title>
<defs><clipPath id="kort-amir"><rect width="960" height="528" rx="18"/></clipPath></defs>
<g clip-path="url(#kort-amir)">
<rect width="960" height="528" fill="#ffffff"/>
<rect width="300" height="528" fill="#fff4e6"/>
<circle cx="290" cy="498" r="110" fill="#b45309" opacity=".06"/>
<circle cx="30" cy="20" r="70" fill="#b45309" opacity=".07"/>
<rect width="960" height="6" fill="#b45309"/>
<defs><clipPath id="klipp-amir"><circle cx="100" cy="100" r="100"/></clipPath></defs><g transform="translate(68 40) scale(0.82)"><circle cx="100" cy="100" r="100" fill="#fde3c4"/><g clip-path="url(#klipp-amir)"><path d="M36 214 Q38 160 100 154 Q162 160 164 214 Z" fill="#e07a1f"/><path d="M70 150 Q100 176 130 150" stroke="rgba(0,0,0,.2)" stroke-width="5" fill="none"/><path d="M90 168 L88 196 M110 168 L112 196" stroke="#f4f1ec" stroke-width="3" stroke-linecap="round"/><path d="M40 168 Q44 190 46 214 M160 168 Q156 190 154 214" stroke="#b45309" stroke-width="7" fill="none"/><rect x="88" y="122" width="24" height="34" rx="9" fill="#bd8662"/><circle cx="60" cy="102" r="8" fill="#dba582"/><circle cx="140" cy="102" r="8" fill="#dba582"/><ellipse cx="100" cy="98" rx="41" ry="42" fill="#dba582"/><circle cx="86" cy="100" r="3.8" fill="#2a2522"/><circle cx="114" cy="100" r="3.8" fill="#2a2522"/><circle cx="87.2" cy="98.8" r="1.1" fill="#fff"/><circle cx="115.2" cy="98.8" r="1.1" fill="#fff"/><path d="M78 89 Q86 85 93 89" stroke="#2b1d16" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M107 89 Q114 85 122 89" stroke="#2b1d16" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M100 106 Q96 116 101 118" stroke="#bd8662" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="80" cy="116" r="7" fill="#e8806f" opacity=".28"/><circle cx="120" cy="116" r="7" fill="#e8806f" opacity=".28"/><path d="M89 126 Q100 135 111 126" stroke="#8a4a3c" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M60 90 Q54 46 92 40 L98 30 L106 40 L118 33 L120 45 Q144 52 140 90 Q134 66 104 63 Q74 63 60 90 Z" fill="#2b1d16"/></g><circle cx="100" cy="100" r="98.5" fill="none" stroke="#ffffff" stroke-width="3"/></g><text x="150" y="238" font-size="23" font-weight="700" fill="#1e2b3c" text-anchor="middle">Amir Rahimi</text><text x="150" y="262" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">12 år · 7. trinn ved Lykke barneskole ·</text><text x="150" y="281" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">storebror til Lea</text><rect x="87.5" y="314" width="125" height="26" rx="13" fill="#fff"/><text x="150" y="331.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Ser bare seg selv</text><rect x="72.375" y="346" width="155.25" height="26" rx="13" fill="#fff"/><text x="150" y="363.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Foreldrene er foresatte</text><path d="M28 434 h244" stroke="#b45309" stroke-opacity=".35" stroke-width="1.5"/><text x="28" y="464" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">«Alle snakker om Lea. Jeg vil bare</text><text x="28" y="486" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">vite hva jeg skal levere.»</text>
<text x="336" y="46" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="1.1">PERSONA · BARNET SOM SER SIN EGEN OVERSIKT</text><text x="336" y="76" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">Skal begynne på ungdomsskolen til høsten. Lillesøsteren er alvorlig syk og</text><text x="336" y="99" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">bestefaren er død, og mye av oppmerksomheten hjemme går til Lea.</text><text x="336" y="140" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">BEHOV</text><text x="644" y="140" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">DET SOM ER VANSKELIG I DAG</text><circle cx="344" cy="159" r="4" fill="#b45309"/><text x="360" y="164" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Egne skoleoppgaver med enkle ord</text><circle cx="344" cy="189" r="4" fill="#b45309"/><text x="360" y="194" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Snakke med helsesykepleieren uten at</text><text x="360" y="214" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">foreldrene får vite det</text><circle cx="344" cy="239" r="4" fill="#b45309"/><text x="360" y="244" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">At skolen vet at han har det tungt, hvis</text><text x="360" y="264" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">foreldrene sier ja</text><circle cx="652" cy="159" r="8" fill="#fbe3df"/><path d="M652 155 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="162.8" r="1.3" fill="#b42318"/><text x="668" y="164" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Frister forsvinner i foreldrenes innboks</text><circle cx="652" cy="189" r="8" fill="#fbe3df"/><path d="M652 185 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="192.8" r="1.3" fill="#b42318"/><text x="668" y="194" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Ingen forklarer ham hva som skjer med</text><text x="668" y="214" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Lea</text><circle cx="652" cy="239" r="8" fill="#fbe3df"/><path d="M652 235 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="242.8" r="1.3" fill="#b42318"/><text x="668" y="244" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Overgangen til ungdomsskolen kommer</text><text x="668" y="264" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">samtidig</text><rect x="336" y="302" width="588" height="142" rx="12" fill="#fff4e6"/><text x="356" y="332" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="1.1">DET OVERSIKTEN GIR</text><circle cx="364" cy="349" r="8" fill="#b45309"/><path d="M360.4 349 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="354" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Tekster skrevet til ham, som «Du har lest mer og raskere siden 5. trinn»</text><circle cx="364" cy="379" r="8" fill="#b45309"/><path d="M360.4 379 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="384" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Samtalen med helsesykepleieren, som foreldrene ikke ser</text><circle cx="364" cy="409" r="8" fill="#b45309"/><path d="M360.4 409 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="414" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Søskentilbud ved sykehuset, foreslått til foreldrene</text><rect x="336" y="466" width="101.5" height="26" rx="13" fill="#fff" stroke="#b45309" stroke-width="1.2"/><text x="386.75" y="483.5" font-size="12.5" font-weight="600" fill="#b45309" text-anchor="middle">Barn og skole</text>
</g>
<rect x=".75" y=".75" width="958.5" height="526.5" rx="17.5" fill="none" stroke="#d6dde6" stroke-width="1.5"/>
</svg>
