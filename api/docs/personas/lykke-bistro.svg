<svg xmlns="http://www.w3.org/2000/svg" width="960" height="551" viewBox="0 0 960 551" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="tittel-lykke-bistro">
