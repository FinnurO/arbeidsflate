<defs><clipPath id="klipp-lykke-bistro"><circle cx="100" cy="100" r="100"/></clipPath></defs><g transform="translate(68 40) scale(0.82)"><circle cx="100" cy="100" r="100" fill="#fde0cc"/><g clip-path="url(#klipp-lykke-bistro)"><rect x="46" y="92" width="108" height="100" fill="#fbf7f2"/><rect x="40" y="70" width="120" height="24" fill="#c2410c"/><rect x="40" y="70" width="10" height="24" fill="#ffffff"/><rect x="60" y="70" width="10" height="24" fill="#ffffff"/><rect x="80" y="70" width="10" height="24" fill="#ffffff"/><rect x="100" y="70" width="10" height="24" fill="#ffffff"/><rect x="120" y="70" width="10" height="24" fill="#ffffff"/><rect x="140" y="70" width="10" height="24" fill="#ffffff"/><path d="M40 94 a10 10 0 0 0 20 0 Z" fill="#c2410c"/><path d="M60 94 a10 10 0 0 0 20 0 Z" fill="#ffffff"/><path d="M80 94 a10 10 0 0 0 20 0 Z" fill="#c2410c"/><path d="M100 94 a10 10 0 0 0 20 0 Z" fill="#ffffff"/><path d="M120 94 a10 10 0 0 0 20 0 Z" fill="#c2410c"/><path d="M140 94 a10 10 0 0 0 20 0 Z" fill="#ffffff"/><rect x="56" y="54" width="88" height="16" rx="3" fill="#1e2b3c"/><text x="100" y="66" font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.2">LYKKE BISTRO</text><rect x="58" y="112" width="40" height="34" rx="3" fill="#cfe3f5"/><path d="M58 129 H98 M78 112 V146" stroke="#fff" stroke-width="2"/><rect x="108" y="112" width="34" height="80" rx="3" fill="#6b4a36"/><circle cx="135" cy="152" r="2.4" fill="#e0b64a"/><rect x="62" y="158" width="32" height="20" rx="3" fill="#c2410c" opacity=".85"/><path d="M68 168 h20" stroke="#fff" stroke-width="2"/><rect x="30" y="192" width="140" height="10" fill="#c7ccd3"/></g><circle cx="100" cy="100" r="98.5" fill="none" stroke="#ffffff" stroke-width="3"/></g><text x="150" y="238" font-size="23" font-weight="700" fill="#1e2b3c" text-anchor="middle">Lykke Bistro AS</text><text x="150" y="262" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">Restaurant i Lykke sentrum · 6 ansatte ·</text><text x="150" y="281" font-size="13.5" font-weight="400" fill="#4f5d70" text-anchor="middle">eid av Nora, Jonas og dødsboet</text><rect x="83.75" y="314" width="132.5" height="26" rx="13" fill="#fff"/><text x="150" y="331.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Nora · daglig leder</text><rect x="84" y="346" width="132" height="26" rx="13" fill="#fff"/><text x="150" y="363.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Jonas · styreleder</text><rect x="49.75" y="378" width="200.5" height="26" rx="13" fill="#fff"/><text x="150" y="395.5" font-size="12.5" font-weight="600" fill="#1e2b3c" text-anchor="middle">Regnskapsfører · skatt og mva</text><path d="M28 433 h244" stroke="#c2410c" stroke-opacity=".35" stroke-width="1.5"/><text x="28" y="463" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">«Vanlige frister er nok. Nå kommer</text><text x="28" y="485" font-size="15" font-weight="400" fill="#1e2b3c" text-anchor="start" font-style="italic">familiens saker i tillegg.»</text><text x="28" y="511" font-size="12.5" fill="#4f5d70">– Nora, daglig leder</text>
<text x="336" y="46" font-size="11.5" font-weight="700" fill="#c2410c" letter-spacing="1.1">PERSONA · VIRKSOMHETEN</text><text x="336" y="76" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">En vanlig, travel restaurant med a-melding, mva og omsetningsoppgave for alkohol.</text><text x="336" y="99" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">Det som skjer i familien, gir restauranten nye oppgaver som ingen etat forklarer</text><text x="336" y="122" font-size="15.5" font-weight="400" fill="#1e2b3c" text-anchor="start">sammenhengen i.</text><text x="336" y="163" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">BEHOV</text><text x="644" y="163" font-size="11.5" font-weight="700" fill="#4f5d70" letter-spacing="1.1">DET SOM ER VANSKELIG I DAG</text><circle cx="344" cy="182" r="4" fill="#c2410c"/><text x="360" y="187" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Se frister for a-melding, mva og alkohol</text><circle cx="344" cy="212" r="4" fill="#c2410c"/><text x="360" y="217" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Forstå hvorfor nye oppgaver dukker opp</text><circle cx="344" cy="242" r="4" fill="#c2410c"/><text x="360" y="247" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Styre hvem som ser hva</text><circle cx="652" cy="182" r="8" fill="#fbe3df"/><path d="M652 178 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="185.8" r="1.3" fill="#b42318"/><text x="668" y="187" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Inntektsmeldingen stopper Noras</text><text x="668" y="207" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">pleiepenger</text><circle cx="652" cy="232" r="8" fill="#fbe3df"/><path d="M652 228 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="235.8" r="1.3" fill="#b42318"/><text x="668" y="237" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Skjenkebevillingen mangler</text><text x="668" y="257" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">stedfortreder</text><circle cx="652" cy="282" r="8" fill="#fbe3df"/><path d="M652 278 v4.6" stroke="#b42318" stroke-width="2.2" stroke-linecap="round"/><circle cx="652" cy="285.8" r="1.3" fill="#b42318"/><text x="668" y="287" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Aksjeeierne må meldes etter skiftet</text><rect x="336" y="325" width="588" height="142" rx="12" fill="#fff1e8"/><text x="356" y="355" font-size="11.5" font-weight="700" fill="#c2410c" letter-spacing="1.1">DET OVERSIKTEN GIR</text><circle cx="364" cy="372" r="8" fill="#c2410c"/><path d="M360.4 372 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="377" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Oppgavene med begrunnelse, også de som kommer fra familien</text><circle cx="364" cy="402" r="8" fill="#c2410c"/><path d="M360.4 402 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="407" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Sammenhengen til Lea og dødsboet</text><circle cx="364" cy="432" r="8" fill="#c2410c"/><path d="M360.4 432 l2.6 2.8 l4.8 -5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="437" font-size="14" font-weight="400" fill="#1e2b3c" text-anchor="start">Hvem som ser oversikten, og at regnskapsføreren bare ser skatt og mva</text><rect x="336" y="489" width="93.5" height="26" rx="13" fill="#fff" stroke="#c2410c" stroke-width="1.2"/><text x="382.75" y="506.5" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle">Drive bedrift</text>
